---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: Create test users
      user:
        name: "{{ item }}"
        state: present
        create_home: true
      loop: [testuser, testuser2]

    - name: Install required packages for testing
      package:
        name:
          - flatpak
          - firewalld
          - git
        state: present

  vars_files:
    - ../../../../group_vars/all
    - ../../../../group_vars/directory_structure
    - ../../../../group_vars/flatpak_apps

  vars:
    target_users: [testuser, testuser2]

  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
