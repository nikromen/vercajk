---
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/../../collections/requirements.yml

driver:
  name: podman

platforms:
  - name: vercajk-test
    image: registry.fedoraproject.org/fedora:latest
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
  inventory:
    host_vars:
      vercajk-test:
        # Two users, to exercise the per-user task loop (e.g. a shared desktop).
        target_users: [testuser, testuser2]

verifier:
  name: testinfra
  options:
    v: true
