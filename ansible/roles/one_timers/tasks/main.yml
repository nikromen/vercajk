---
# Machine-wide tasks: run once, regardless of how many target_users are configured.
- name: Setup shared-documents group and directory
  import_tasks: shared_documents.yml
  tags:
    - shared_documents

- name: Include firewall setup
  import_tasks: firewall.yml
  tags:
    - firewall

- name: Install system-wide flatpak apps
  import_tasks: flatpak_system.yml
  tags:
    - flatpak

- name: Configure greetd login manager
  import_tasks: greetd.yml
  tags:
    - greetd

- name: Harden sshd configuration
  import_tasks: sshd.yml
  tags:
    - sshd

# Per-user tasks: run once for every user in target_users.
- name: Create directory tree for each target user
  include_tasks: directory_structure.yml
  loop: "{{ target_users }}"
  loop_control:
    loop_var: target_user
  vars:
    home_dir: "/home/{{ target_user }}"
  tags:
    - directory_structure

- name: Import rpm related dev tools for each target user
  include_tasks: rpm.yml
  loop: "{{ target_users }}"
  loop_control:
    loop_var: target_user
  tags:
    - rpm
    - development_tools

- name: Setup tmux plugin manager for each target user
  include_tasks: tmux.yml
  loop: "{{ target_users }}"
  loop_control:
    loop_var: target_user
  vars:
    home_dir: "/home/{{ target_user }}"
  tags:
    - tmux

- name: Install user flatpak apps for each target user
  include_tasks: flatpak_user.yml
  loop: "{{ target_users }}"
  loop_control:
    loop_var: target_user
  tags:
    - flatpak
    - games
